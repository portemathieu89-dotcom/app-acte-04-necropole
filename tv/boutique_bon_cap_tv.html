<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Au Bon Cap — The Last Heart</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#0b0806;color:#eee8dc}body{font-family:Georgia,serif}.shop-tv{min-height:100vh;padding:22px 28px;background:radial-gradient(circle at top,#302219 0,#120c08 55%,#080605 100%)}h1{text-align:center;color:#d8b46a;font-size:38px;margin:0 0 4px}.subtitle{text-align:center;color:#b9a890;font-size:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:1800px;margin:0 auto}.card{background:linear-gradient(145deg,#2a1f17,#15100c);border:1px solid #765534;border-radius:10px;padding:13px 12px;min-height:185px;box-shadow:0 7px 18px #0008;display:flex;flex-direction:column}.name{font-size:18px;font-weight:bold;color:#e4c681;line-height:1.12;min-height:42px;display:flex;align-items:center;gap:6px}.item-icon{width:34px;height:34px;object-fit:contain;flex:0 0 34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.price{font-size:18px;color:#f0d17d;font-weight:bold;margin:7px 0}.effect{font-size:14px;line-height:1.25;color:#eee8dc;margin-top:2px}.footer{text-align:center;color:#8d806f;font-size:12px;margin-top:12px}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><style>
#tvToolbar{position:fixed;top:12px;right:12px;z-index:50;display:flex;gap:6px;opacity:.2;transition:opacity .2s}
#tvToolbar:hover{opacity:1}
#tvToolbar button{background:rgba(49,35,23,.94);color:#fff;border:1px solid #89673c;border-radius:6px;padding:8px 12px;cursor:pointer;font-family:Georgia,serif;box-shadow:0 3px 12px #000}
@media(max-width:800px){#tvToolbar{opacity:.65}}
</style></head><body><div id="tvToolbar"><button type="button" onclick="toggleFullscreen()">⛶ Plein écran</button></div><main class="shop-tv"><h1>🧭 Au Bon Cap</h1><div class="subtitle">Matériel d’aventure, de navigation, de survie et d’exploration</div><section id="grid" class="grid"></section><div class="footer">The Last Heart — Néréa · Affichage boutique</div></main><script>
const items=[
['Kit d’escalade','25 po','Permet de sécuriser une escalade avec cordes, sangles et pitons.'],['Corde en soie (15 m)','10 po','Supporte jusqu’à 272 kg. Utile pour grimper, descendre ou sécuriser un passage.'],['Grappin','2 po','Se fixe au bout d’une corde pour s’accrocher à une corniche, un arbre, un bâtiment, etc.'],['Matériel de pêche','1 po','Permet de pêcher.'],['Outils de navigateur','25 po','Permettent de déterminer sa position et de naviguer correctement.'],['Longue-vue','1 000 po','Permet d’observer des objets ou des personnes à grande distance.'],['Kit de soins','5 po','Permet de stabiliser une créature à 0 PV sans test de Médecine. 10 utilisations.'],['Menottes','2 po','Permettent de maintenir une créature prisonnière.'],['Pied-de-biche','2 po','Donne un avantage aux tests de Force lorsqu’il peut être utilisé comme levier.'],['Bloc et palan','1 po','Permet de soulever jusqu’à 4 fois le poids normalement transportable.'],['Pitons ×10','1 po','Permettent de fixer une corde à une surface.'],['Miroir en acier','5 po','Permet de regarder derrière soi ou autour d’un angle sans s’exposer.'],['Lanterne à capuchon','5 po','Éclaire sur 18 m, avec 18 m supplémentaires en lumière faible. Peut être masquée.'],['Lanterne à faisceau','10 po','Produit un faisceau de lumière sur 18 m, avec 18 m supplémentaires en lumière faible.'],['Perche (3 m)','5 pc','Permet de tester ou manipuler des objets à distance.'],['Outre','2 pa','Contient environ 0,5 L d’eau.'],['Tente pour deux personnes','2 po','Permet de dormir à l’abri des intempéries.'],['Sac à dos','2 po','Permet de transporter du matériel.'],['Sacoche','5 pa','Petit sac permettant de transporter des objets.'],['Carte maritime','50 po','Carte maritime détaillée permettant de mieux se repérer et de préparer ses voyages.']];
const icons={
'Kit d’escalade':'../images/equipement/kit_escalade.png','Corde en soie (15 m)':'../images/equipement/corde_soie.png','Grappin':'../images/equipement/grappin.png','Matériel de pêche':'../images/equipement/materiel_peche.png','Outils de navigateur':'../images/equipement/outils_navigateur.png','Longue-vue':'../images/equipement/longue_vue.png','Kit de soins':'../images/equipement/kit_soins.png','Menottes':'../images/equipement/menottes.png','Pied-de-biche':'../images/equipement/pied_de_biche.png','Bloc et palan':'../images/equipement/bloc_et_palan.png','Pitons ×10':'../images/equipement/pitons.png','Miroir en acier':'../images/equipement/miroir_acier.png','Lanterne à capuchon':'../images/equipement/lanterne_capuchon.png','Lanterne à faisceau':'../images/equipement/lanterne_faisceau.png','Perche (3 m)':'../images/equipement/perche.png','Outre':'../images/equipement/outre.png','Tente pour deux personnes':'../images/equipement/tente_2_personnes.png','Sac à dos':'../images/equipement/sac_a_dos.png','Sacoche':'../images/equipement/sacoche.png','Carte maritime':'../images/equipement/carte_maritime.png'};
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));document.getElementById('grid').innerHTML=items.map(p=>`<article class="card"><div class="name"><img class="item-icon" src="${icons[p[0]]||''}" alt="">${esc(p[0])}</div><div class="price">🪙 ${esc(p[1])}</div><div class="effect">${esc(p[2])}</div></article>`).join('');
</script><script>
async function toggleFullscreen(){
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage({type:'theLastHeartTVCommand',command:'fullscreen'},'*');
      return;
    }
    if(document.fullscreenElement)await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{
  const b=document.querySelector('#tvToolbar button');
  if(b)b.textContent=document.fullscreenElement?'↙ Quitter le plein écran':'⛶ Plein écran';
});
</script></body></html>
