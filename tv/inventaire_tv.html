<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventaires des joueurs — The Last Heart</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090706}body{font-family:Georgia,serif}.inventory-tv{min-height:100vh;background:radial-gradient(circle at top,#2c2118,#090706 70%);color:#eee8dc;padding:28px}.inventory-tv h1{text-align:center;color:#d8b46a;margin:0 0 22px;font-size:42px}.inventory-tv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:1500px;margin:auto}.tv-player{background:linear-gradient(145deg,#2b2017,#130d09);border:2px solid #765534;border-radius:14px;padding:20px;min-height:270px;box-shadow:0 10px 30px #0008}.tv-player h2{margin:0 0 12px;color:#d8b46a;font-size:30px}.tv-po{font-size:23px;margin-bottom:15px}.tv-item{font-size:20px;padding:8px 0;border-bottom:1px solid #76553466}.tv-item-effect{font-size:15px;line-height:1.3;color:#cfc2ad;opacity:.82;margin-top:4px;padding-left:28px}.tv-empty{opacity:.55;font-style:italic;font-size:18px}.tv-updated{text-align:center;opacity:.45;margin-top:18px;font-size:13px}@media(max-width:800px){.inventory-tv-grid{grid-template-columns:1fr}}.potion-icon{width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.tv-item-main{display:flex;align-items:center;gap:2px}</style><style> .tv-name-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}.tv-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #b98b4f;box-shadow:0 4px 12px #0008}.tv-player h2{display:flex;align-items:center;margin:0}.tv-player h2 .tv-name{display:flex;align-items:center;gap:12px}.tv-toolbar{position:fixed;top:14px;right:14px;z-index:20;display:flex;gap:6px;opacity:.25;transition:opacity .2s}.tv-toolbar:hover{opacity:1}.tv-toolbar button{background:rgba(49,35,23,.92);color:#fff;border:1px solid #89673c;border-radius:6px;padding:8px 12px;cursor:pointer;font-family:Georgia,serif;box-shadow:0 3px 12px #000}</style></head><body><div class="inventory-tv"><h1>🎒 Inventaires — The Last Heart</h1><div class="tv-toolbar"><button type="button" onclick="toggleFullscreen()">⛶ Plein écran</button></div><div id="grid" class="inventory-tv-grid"></div><div class="tv-updated">Mise à jour automatique</div></div><script>const players=['Fïnn','Akio','Sylas','Syvens'];const key='theLastHeartPlayerInventories';
const potionIcons={"Potion de soins":"../images/potions/soins.png","Potion de soins supérieure":"../images/potions/soins_superieure.png","Potion de soins suprême":"../images/potions/soins_supreme.png","Potion de respiration aquatique":"../images/potions/respiration_aquatique.png","Potion d\'escalade":"../images/potions/escalade.png","Potion de croissance":"../images/potions/croissance.png","Potion de résistance":"../images/potions/resistance.png","Potion d\'amitié animale":"../images/potions/amitie_animale.png","Potion de souffle de feu":"../images/potions/souffle_de_feu.png","Potion d\'héroïsme":"../images/potions/heroisme.png","Potion de forme gazeuse":"../images/potions/forme_gazeuse.png","Potion de clairvoyance":"../images/potions/clairvoyance.png","Potion de lecture des pensées":"../images/potions/lecture_des_pensees.png","Potion d\'invisibilité":"../images/potions/invisibilite.png","Potion d\'invulnérabilité":"../images/potions/invulnerabilite.png","Potion de vitesse":"../images/potions/vitesse.png","Potion de vitalité":"../images/potions/vitalite.png"};
const equipmentIcons={'Kit d’escalade':'../images/equipement/kit_escalade.png','Corde en soie (15 m)':'../images/equipement/corde_soie.png','Grappin':'../images/equipement/grappin.png','Matériel de pêche':'../images/equipement/materiel_peche.png','Outils de navigateur':'../images/equipement/outils_navigateur.png','Longue-vue':'../images/equipement/longue_vue.png','Kit de soins':'../images/equipement/kit_soins.png','Menottes':'../images/equipement/menottes.png','Pied-de-biche':'../images/equipement/pied_de_biche.png','Bloc et palan':'../images/equipement/bloc_et_palan.png','Pitons ×10':'../images/equipement/pitons.png','Miroir en acier':'../images/equipement/miroir_acier.png','Lanterne à capuchon':'../images/equipement/lanterne_capuchon.png','Lanterne à faisceau':'../images/equipement/lanterne_faisceau.png','Perche (3 m)':'../images/equipement/perche.png','Outre':'../images/equipement/outre.png','Tente pour deux personnes':'../images/equipement/tente_2_personnes.png','Sac à dos':'../images/equipement/sac_a_dos.png','Sacoche':'../images/equipement/sacoche.png','Carte maritime':'../images/equipement/carte_maritime.png'};
const lootIcons={
 'Peau de crocodile':'../images/loot/crocodile_peau.webp',
 'Dents de crocodile':'../images/loot/crocodile_dents.webp',
 'Griffes de crocodile':'../images/loot/crocodile_griffes.webp',
 'Glande toxique':'../images/loot/crocodile_glande_toxique.webp',
 'Écaille dorsale intacte':'../images/loot/crocodile_ecaille_dorsale.webp',
 'Peau de tigre':'../images/loot/tigre_peau.webp',
 'Crocs de tigre':'../images/loot/tigre_crocs.webp',
 'Griffes de tigre':'../images/loot/tigre_griffes.webp',
 'Fourrure de tigre':'../images/loot/tigre_fourrure.webp',
 'Canine de tigre parfaite':'../images/loot/tigre_canine_parfaite.webp',
 'Peau de Kazurack':'../images/loot/kazhurak_ecaille.webp',
 'Griffes de chimère':'../images/loot/kazhurak_griffes.webp',
 'Crocs de chimère':'../images/loot/kazhurak_crocs.webp',
 'Œil de chimère':'../images/loot/kazhurak_criniere.webp',
 'Cœur de chimère':'../images/loot/kazhurak_coeur.webp',
 'Cœur cristallisé de Kazurack':'../images/loot/kazhurak_coeur_cristallise.webp'
};
function itemIcon(name){return lootIcons[String(name)]||potionIcons[name]||equipmentIcons[name]||'';}
const potionEffects={
 'Potion de soins':'Rend 2d4 + 2 PV.',
 'Potion de soins supérieure':'Rend 4d4 + 4 PV.',
 'Potion de soins suprême':'Rend 8d4 + 8 PV.',
 'Potion de respiration aquatique':'Permet de respirer sous l’eau pendant 1 heure.',
 'Potion d’escalade':'Pendant 1 heure, vitesse d’escalade égale à la vitesse de déplacement et avantage aux tests pour grimper.',
 'Potion de croissance':'Effet d’Agrandissement pendant 1d4 heures, sans concentration.',
 'Potion de résistance':'Donne la résistance à un type de dégâts choisi pendant 1 heure.',
 'Potion d’amitié animale':'Permet d’utiliser l’effet d’Amitié avec les animaux pendant 1 heure.',
 'Potion de souffle de feu':'Pendant 1 heure, permet de cracher du feu : attaque à distance, 4d6 dégâts de feu en cas d’échec du JS approprié.',
 'Potion d’héroïsme':'Pendant 1 h : 10 PV temporaires + effet de Bénédiction, sans concentration.',
 'Potion de forme gazeuse':'Permet de prendre une forme gazeuse pendant 1 heure.',
 'Potion de clairvoyance':'Permet d’utiliser l’effet de Clairvoyance.',
 'Potion de lecture des pensées':'Effet de Détection des pensées, DD 13.',
 'Potion d’invisibilité':'Rend invisible pendant 1 heure. L’effet prend fin si le personnage attaque ou lance un sort.',
 'Potion d’invulnérabilité':'Résistance à tous les dégâts pendant 1 minute.',
 'Potion de vitesse':'Effet de Hâte pendant 1 minute, sans concentration.',
 'Potion de vitalité':'Supprime l’épuisement et les maladies/poisons et améliore fortement la récupération.'
};
function potionEffect(name){const exact=Object.keys(potionEffects).find(k=>k.toLowerCase()===String(name).toLowerCase());return exact?potionEffects[exact]:'';}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}if(!Array.isArray(data)||data.length!==4)data=players.map(name=>({name,po:0,items:[]}));document.getElementById('grid').innerHTML=data.map((p,i)=>`<div class="tv-player"><h2><span class="tv-name"><img class="tv-avatar" src="${['../images/joueurs/finn.png','../images/joueurs/akio.png','../images/joueurs/sylas.png','../images/joueurs/syvens.png'][i]}" alt="${esc(players[i])}">${esc(players[i])}</span></h2><div class="tv-po">💰 <b>${Number(p.po)||0} PO</b></div>${Array.isArray(p.items)&&p.items.length?p.items.map(it=>{const ef=potionEffect(it.name);return `<div class="tv-item"><div class="tv-item-main">${itemIcon(it.name)?`<img class="potion-icon" src="${itemIcon(it.name)}" alt="">`:'🎒 '}${esc(it.name)} × ${Number(it.qty)||0}</div>${ef?`<div class="tv-item-effect">${esc(ef)}</div>`:''}</div>`}).join(''):'<div class="tv-empty">Aucun objet</div>'}</div>`).join('')}render();
window.addEventListener('storage',render);
window.addEventListener('message',e=>{if(e.data&&e.data.type==='theLastHeartInventories'){try{localStorage.setItem(key,JSON.stringify(e.data.data));}catch(_){ } render();}});
try{if('BroadcastChannel' in window){const ch=new BroadcastChannel('theLastHeartInventories');ch.onmessage=e=>{if(e.data&&e.data.type==='theLastHeartInventories'){try{localStorage.setItem(key,JSON.stringify(e.data.data));}catch(_){ }render();}}}}catch(e){}
setInterval(render,1000);
async function toggleFullscreen(){
  try{
    if(window.parent && window.parent!==window){
      window.parent.postMessage({type:'theLastHeartTVCommand',command:'fullscreen'},'*');
      return;
    }
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{
  const b=document.querySelector('.tv-toolbar button');
  if(b)b.textContent=document.fullscreenElement?'↙ Quitter le plein écran':'⛶ Plein écran';
});
</script></body></html>
